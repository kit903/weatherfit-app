name: Build Web
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: flutter create . --platforms web
    - run: flutter pub get
    - run: flutter build web --release
    - uses: actions/upload-artifact@v4
      with:
        name: weatherfit-web
        path: build/web
